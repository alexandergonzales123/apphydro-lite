# Compila un .ipa de iOS SIN FIRMAR en un runner macOS de GitHub (gratis en repos públicos;
# en privados consume minutos macOS). Luego se firma e instala desde Windows con Sideloadly o
# AltStore usando un Apple ID gratuito (la app caduca a los 7 días).
#
# Secrets del repo (Settings → Secrets and variables → Actions):
#   EXPO_PUBLIC_API_URL  URL HTTPS de la API (en Release iOS bloquea HTTP)
#   EXPO_PUBLIC_API_KEY  = API_KEY del backend
#
# Se lanza a mano: pestaña Actions → "iOS unsigned IPA" → Run workflow.
name: iOS unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_API_KEY: ${{ secrets.EXPO_PUBLIC_API_KEY }}
      # expo-dev-client no se incluye en Release; se evita cualquier prompt interactivo.
      CI: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar secrets
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ] || [ -z "$EXPO_PUBLIC_API_KEY" ]; then
            echo "::error::Faltan los secrets EXPO_PUBLIC_API_URL / EXPO_PUBLIC_API_KEY"; exit 1
          fi
          case "$EXPO_PUBLIC_API_URL" in https://*) ;; *) echo "::error::EXPO_PUBLIC_API_URL debe ser https://"; exit 1;; esac

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar proyecto nativo iOS (prebuild + pods)
        run: npx expo prebuild --platform ios --clean

      - name: Compilar Release sin firmar
        run: |
          WORKSPACE=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          echo "Workspace: $WORKSPACE  Scheme: $SCHEME"
          set -o pipefail
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning: .*deprecated|\*\* BUILD" || true
          test -d build/Build/Products/Release-iphoneos/*.app

      - name: Empaquetar .ipa
        run: |
          APP=$(ls -d build/Build/Products/Release-iphoneos/*.app | head -1)
          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          cd out && zip -qry ../AR-Infra-Lite-unsigned.ipa Payload
          ls -lh ../AR-Infra-Lite-unsigned.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: AR-Infra-Lite-unsigned-ipa
          path: mobile/AR-Infra-Lite-unsigned.ipa
          retention-days: 14

      - name: Log de xcodebuild si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: mobile/xcodebuild.log
          if-no-files-found: ignore
